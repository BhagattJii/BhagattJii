name: Metrics

on:
  # Refresh the dashboard once a day
  schedule: [{cron: "0 6 * * *"}]
  # Allows manual refresh from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: BhagattJii
          filename: metrics.svg
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          config_order: base.header, base.activity+base.community, languages, calendar, isocalendar, repositories, followup, introduction
          output_action: commit
          committer_branch: main
          committer_message: "chore: refresh metrics dashboard"

          # Languages
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_threshold: 2
          plugin_languages_sections: most-used
          plugin_languages_details: lines, percentage
          plugin_languages_indepth: no
          plugin_languages_ignored: html, css, tex, dockerfile, makefile, shell

          # Annual commit calendar
          plugin_calendar: yes
          plugin_calendar_limit: 1

          # Isometric commit calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Featured repositories
          plugin_repositories: yes
          plugin_repositories_featured: meowbox, askwild, BJ-Studio
          plugin_repositories_forks: no

          # Follow-up of issues and pull requests
          plugin_followup: yes
          plugin_followup_sections: repositories
          plugin_followup_indepth: no

          # Introduction
          plugin_introduction: yes
          plugin_introduction_title: yes

          extras_css: |
            * { font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important; }
            h1, h2, h3, .field { border-radius: 6px; }
            .field { border: 1px solid #21262d !important; }
            svg { background: transparent !important; }
            .row { gap: 8px; }
            .calendar { border-radius: 6px; overflow: hidden; }
