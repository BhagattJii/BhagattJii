<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Lakshay Verma - Full-stack &amp; Android Developer">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="accentH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.2" r="0.65">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="#0d1117"/>
  <rect width="1200" height="300" fill="url(#glow)"/>
  <rect x="0" y="0" width="6" height="300" fill="url(#accent)"/>

  <g font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="72" y="112" fill="#f0f6fc" font-size="58" font-weight="700" letter-spacing="3">LAKSHAY VERMA</text>
    <rect x="72" y="132" width="280" height="3" rx="1.5" fill="url(#accentH)"/>

    <text x="72" y="180" fill="#58a6ff" font-size="27" font-weight="600" letter-spacing="0.4">Full-stack &amp; Android Developer</text>

    <text x="72" y="220" fill="#8b949e" font-size="19">I make small apps that don't need an account or a subscription</text>

    <g font-size="15" font-weight="600">
      <rect x="72" y="242" width="92" height="32" rx="16" fill="#161b22" stroke="#30363d"/>
      <text x="118" y="263" fill="#c9d1d9" text-anchor="middle">Kotlin</text>

      <rect x="174" y="242" width="98" height="32" rx="16" fill="#161b22" stroke="#30363d"/>
      <text x="223" y="263" fill="#c9d1d9" text-anchor="middle">Next.js</text>

      <rect x="282" y="242" width="106" height="32" rx="16" fill="#161b22" stroke="#30363d"/>
      <text x="335" y="263" fill="#c9d1d9" text-anchor="middle">TypeScript</text>

      <rect x="398" y="242" width="104" height="32" rx="16" fill="#161b22" stroke="#30363d"/>
      <text x="450" y="263" fill="#c9d1d9" text-anchor="middle">Android</text>
    </g>

    <g>
      <rect x="972" y="60" width="168" height="180" rx="26" fill="url(#panel)" stroke="url(#accentH)" stroke-width="2"/>
      <text x="1056" y="172" fill="url(#accentH)" font-size="66" font-weight="700" text-anchor="middle" letter-spacing="2">LV</text>
      <text x="1056" y="208" fill="#6e7681" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="3">GITHUB</text>
    </g>
  </g>
</svg>
